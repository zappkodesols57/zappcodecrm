{% extends "base.html" %}
{% block title %}404 - Page Not Found{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-7 text-center">
      <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5" style="border: 1px solid #E5E7EB !important; border-radius: 16px;">
        <div class="mb-3 text-warning">
          <i class="fa-solid fa-compass fa-4x text-warning"></i>
        </div>
        <h3 class="fw-bold text-dark mb-2" style="color: #052042 !important;">Record or Page Not Found</h3>
        <p class="text-muted mb-4" style="max-width: 480px; margin: 0 auto; line-height: 1.6;">
          The lead, patient record, report, or page you requested does not exist or may have been archived.
        </p>
        <div class="d-flex justify-content-center gap-2">
          <a href="javascript:history.back()" class="btn btn-outline-secondary px-4 rounded-pill" style="height: 38px;">
            <i class="fa-solid fa-arrow-left me-1"></i> Go Back
          </a>
          <a href="{% url 'dashboard:home' %}" class="btn btn-primary text-white px-4 rounded-pill shadow-sm" style="background-color: #052042; border-color: #052042; height: 38px;">
            <i class="fa-solid fa-house me-1"></i> Dashboard
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
