{% extends "base.html" %}
{% block title %}404 - Page Not Found{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-7 text-center">
      <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5">
        <div class="mb-3 text-warning">
          <i class="fa-solid fa-triangle-exclamation fa-4x"></i>
        </div>
        <h3 class="fw-bold text-dark mb-2">Record or Page Not Found</h3>
        <p class="text-muted mb-4">
          The lead, patient record, or page you requested does not exist or may have been moved.
        </p>
        <div class="d-flex justify-content-center gap-2">
          <a href="{% url 'leads:lead_list' %}" class="btn btn-brand text-white px-4">
            <i class="fa-solid fa-list me-1"></i> Go to Leads List
          </a>
          <a href="{% url 'dashboard:home' %}" class="btn btn-outline-secondary px-4">
            <i class="fa-solid fa-house me-1"></i> Dashboard
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
