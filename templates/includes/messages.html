{% if messages %}
  <div class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 9999; max-width: min(480px, 92vw);">
    {% for message in messages %}
    <div class="toast align-items-center shadow-lg border-0 show mb-2 w-100" role="alert" aria-live="assertive" aria-atomic="true"
         style="border-radius: 12px; max-width: 100%; background: {% if message.tags == 'error' or message.tags == 'danger' %}#fef2f2; border: 1px solid #fecaca !important; color: #991b1b;{% elif message.tags == 'success' %}#f0fdf4; border: 1px solid #bbf7d0 !important; color: #166534;{% elif message.tags == 'warning' %}#fffbeb; border: 1px solid #fef3c7 !important; color: #92400e;{% else %}#eff6ff; border: 1px solid #bfdbfe !important; color: #1e40af;{% endif %}">
      <div class="d-flex align-items-start p-2">
        <div class="me-2 ms-2 fs-5 pt-1 flex-shrink-0">
          {% if message.tags == 'error' or message.tags == 'danger' %}
            <i class="fa-solid fa-circle-exclamation text-danger"></i>
          {% elif message.tags == 'success' %}
            <i class="fa-solid fa-circle-check text-success"></i>
          {% elif message.tags == 'warning' %}
            <i class="fa-solid fa-triangle-exclamation text-warning"></i>
          {% else %}
            <i class="fa-solid fa-circle-info text-primary"></i>
          {% endif %}
        </div>
        <div class="toast-body fw-semibold pe-2 flex-grow-1" style="font-size: 0.85rem; line-height: 1.45; word-break: break-word; overflow-wrap: anywhere;">
          {{ message }}
        </div>
        <button type="button" class="btn-close me-2 mt-1 flex-shrink-0 shadow-none" data-bs-dismiss="toast" aria-label="Close"></button>
      </div>
    </div>
    {% endfor %}
  </div>
{% endif %}
