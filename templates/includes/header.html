{% if user.is_authenticated %}
<div class="topbar">
  <button class="btn btn-sm btn-light d-lg-none" onclick="document.getElementById('sidebar').classList.toggle('show')"><i class="fa-solid fa-bars"></i></button>
  <form class="search-box" method="get" action="{% url 'leads:lead_list' %}">
    <input type="search" name="q" class="form-control form-control-sm" placeholder="Search leads by name, mobile, email, lead ID..." value="{{ request.GET.q }}">
  </form>
  <div class="ms-auto d-flex align-items-center gap-2">
    <a href="{% url 'leads:lead_add' %}" class="btn btn-sm btn-brand text-white d-none d-sm-inline-flex align-items-center gap-1">
      <i class="fa-solid fa-user-plus"></i> Add Lead
    </a>

    <!-- Notification Bell -->
    <div class="dropdown me-2">
      <button class="btn btn-sm btn-light position-relative" data-bs-toggle="dropdown" aria-expanded="false" id="notifDropdownBtn" style="border: none; background: transparent; font-size: 1.2rem;">
        <i class="fa-solid fa-bell text-secondary"></i>
        <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" id="notifBadge" style="display: none; font-size: 0.65rem;">
          0
        </span>
      </button>
      <div class="dropdown-menu dropdown-menu-end shadow-lg border-0 p-0" style="width: 320px; max-height: 400px; overflow-y: auto;" id="notifList">
        <div class="p-3 border-bottom d-flex justify-content-between align-items-center bg-light">
          <h6 class="mb-0 fw-bold">Notifications</h6>
          <a href="{% url 'notifications:list' %}" class="small text-decoration-none">View All</a>
        </div>
        <div id="notifItems">
          <div class="p-3 text-center text-muted small"><i class="fa-solid fa-spinner fa-spin"></i> Loading...</div>
        </div>
      </div>
    </div>

    <span class="badge text-bg-light border me-1">{{ user.get_role_display }}</span>
    <div class="dropdown">
      <button class="btn btn-sm btn-outline-secondary dropdown-toggle" data-bs-toggle="dropdown">
        <i class="fa-solid fa-circle-user"></i> {{ user.get_full_name|default:user.username }}
      </button>
      <ul class="dropdown-menu dropdown-menu-end">
        <li><form method="post" action="{% url 'accounts:logout' %}">{% csrf_token %}<button class="dropdown-item" type="submit"><i class="fa-solid fa-right-from-bracket me-1 text-danger"></i> Logout</button></form></li>
      </ul>
    </div>
  </div>
</div>

<script>
  document.addEventListener("DOMContentLoaded", function() {
    const notifBadge = document.getElementById('notifBadge');
    const notifItems = document.getElementById('notifItems');

    function fetchNotifications() {
      fetch('{% url "notifications:api_unread" %}')
        .then(response => response.json())
        .then(data => {
          if (data.count > 0) {
            notifBadge.style.display = 'inline-block';
            notifBadge.textContent = data.count > 99 ? '99+' : data.count;
          } else {
            notifBadge.style.display = 'none';
          }
          
          let html = '';
          if (data.notifications.length === 0) {
            html = '<div class="p-4 text-center text-muted small">No new notifications</div>';
          } else {
            data.notifications.forEach(n => {
              html += `
                <a href="${n.link || '#'}" onclick="markNotificationRead(${n.id})" class="dropdown-item p-3 border-bottom text-wrap" style="white-space: normal;">
                  <div class="d-flex justify-content-between align-items-start">
                    <strong class="text-dark small">${n.title}</strong>
                    <span class="text-muted" style="font-size: 0.7rem;">${n.created_at}</span>
                  </div>
                  <div class="text-muted mt-1" style="font-size: 0.8rem;">${n.message}</div>
                </a>
              `;
            });
          }
          notifItems.innerHTML = html;
        })
        .catch(err => console.error("Error fetching notifications:", err));
    }

    // Polling every 30 seconds
    fetchNotifications();
    setInterval(fetchNotifications, 30000);
  });

  function markNotificationRead(id) {
    fetch(`/notifications/api/mark-read/${id}/`, {
        method: 'POST',
        headers: {
            'X-CSRFToken': '{{ csrf_token }}',
            'Content-Type': 'application/json'
        }
    });
  }
</script>
{% endif %}
