<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/js/tom-select.complete.min.js"></script>
<script>
  // Auto-dismiss toasts
  document.querySelectorAll('.toast').forEach(function(t){ setTimeout(function(){ t.classList.remove('show'); }, 4000); });

  function confirmAction(msg){ return confirm(msg || 'Are you sure?'); }

  // Auto-initialize Tom Select on all form selects across the app
  document.addEventListener("DOMContentLoaded", function() {
    initTomSelects();
  });

  function initTomSelects(container) {
    var root = container || document;
    var selectElements = root.querySelectorAll('select.form-select, select.tom-select');
    selectElements.forEach(function(el) {
      if (el.classList.contains('no-tom-select') || el.tomselect) return;
      
      var isMultiple = el.hasAttribute('multiple');
      var placeholderText = el.getAttribute('placeholder') || 'Type to search...';
      
      // If first option has value="", use its text as placeholder and hide it from the list
      if (el.options.length > 0 && el.options[0].value === "") {
        if (el.options[0].text.trim() !== "") {
          placeholderText = el.options[0].text;
          el.options[0].text = ""; // TomSelect uses empty text options as placeholders
        }
      }
      
      el.setAttribute('placeholder', placeholderText);

      new TomSelect(el, {
        create: false,
        plugins: isMultiple ? ['remove_button'] : [],
        maxOptions: 100,
        placeholder: placeholderText,
        allowEmptyOption: false,
        dropdownParent: 'body'
      });
    });
  }

  // Sidebar Minimize & State Persistence
  document.addEventListener("DOMContentLoaded", function() {
    const isSidebarMinimized = localStorage.getItem('sidebar_minimized') === 'true';
    if (isSidebarMinimized && window.innerWidth >= 992) {
      document.body.classList.add('sidebar-minimized');
    }

    function toggleSidebar() {
      const willMinimize = !document.body.classList.contains('sidebar-minimized');
      if (willMinimize) {
        document.body.classList.add('sidebar-minimized');
        localStorage.setItem('sidebar_minimized', 'true');
      } else {
        document.body.classList.remove('sidebar-minimized');
        localStorage.setItem('sidebar_minimized', 'false');
      }
    }

    const topbarToggleBtn = document.getElementById('sidebarMinimizeBtn');
    if (topbarToggleBtn) {
      topbarToggleBtn.addEventListener('click', toggleSidebar);
    }

    const innerToggleBtn = document.getElementById('sidebarInnerToggleBtn');
    if (innerToggleBtn) {
      innerToggleBtn.addEventListener('click', toggleSidebar);
    }
  });
</script>
