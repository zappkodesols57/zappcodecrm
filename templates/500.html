{% extends "base.html" %}
{% block title %}500 - System Error{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-7 text-center">
      <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5">
        <div class="mb-3 text-danger">
          <i class="fa-solid fa-circle-exclamation fa-4x"></i>
        </div>
        <h3 class="fw-bold text-dark mb-2">Something Went Wrong</h3>
        <p class="text-muted mb-4">
          An unexpected error occurred while processing your request. Please try again or return to the dashboard.
        </p>
        <div class="d-flex justify-content-center gap-2">
          <a href="javascript:history.back()" class="btn btn-outline-secondary px-4">
            <i class="fa-solid fa-arrow-left me-1"></i> Go Back
          </a>
          <a href="{% url 'dashboard:home' %}" class="btn btn-brand text-white px-4">
            <i class="fa-solid fa-house me-1"></i> Dashboard
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
