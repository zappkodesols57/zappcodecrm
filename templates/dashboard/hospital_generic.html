{% extends "base.html" %}
{% block title %}{{ title }} | Nelson CRM{% endblock %}

{% block content %}
<div class="nelson-dashboard">
<div class="container mt-4">
    <div class="card border-0 shadow-sm text-center p-5" style="border-radius: var(--radius-lg, 20px);">
        <div class="card-body py-5">
            <i class="fa-solid fa-person-digging text-primary" style="font-size: 4rem; opacity: 0.8;"></i>
            <h2 class="mt-4 fw-bold text-dark">{{ title }}</h2>
            <p class="text-muted mt-3 mb-0 fs-5">This module is currently under construction.</p>
            <p class="text-muted fs-6 mt-2">Hospital-specific functionality and interfaces will be implemented here soon.</p>
            <a href="{% url 'dashboard:superadmin_home' %}" class="btn btn-primary mt-4 rounded-pill px-4">
                <i class="fa-solid fa-arrow-left me-2"></i> Back to Dashboard
            </a>
        </div>
    </div>
</div>
</div>
{% endblock %}
